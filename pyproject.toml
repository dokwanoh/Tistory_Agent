[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tistory-growth-os"
version = "0.1.0"
description = "Offline, approval-gated content operations for TISTORY GROWTH OS"
requires-python = ">=3.11,<3.15"
dependencies = []

[project.scripts]
tistory-growth-os = "tistory_growth_os.commands.cli:main"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "all"
reportAny = "error"
reportExplicitAny = "error"
reportUnnecessaryTypeIgnoreComment = "error"
